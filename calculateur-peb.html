                {min:126,max:150,prix:225}, {min:151,max:200,prix:225}, {min:201,max:250,prix:255},
                {min:251,max:300,prix:255}, {min:301,max:350,prix:285}
            ],
            basePrice: 285,
            info: {
                title: 'Duplex / Triplex',
                iconId: 'icon-stairs',
                isStroke: true,
                price: '225 € TTC',
                duration: '45 à 75 minutes',
                examples: ['Duplex, triplex, ou quadruplex', 'Appartement sur plusieurs niveaux']
            }
        },
        maison: {
            label: 'Maison',
            iconId: 'icon-home',
            min: 18,
            max: 500,
            default: 100,
            pivot: 450,
            tarif: [
                {min:0,max:100,prix:235}, {min:101,max:150,prix:245}, {min:151,max:200,prix:245},
                {min:201,max:250,prix:275}, {min:251,max:300,prix:295}, {min:301,max:350,prix:335},
                {min:351,max:400,prix:365}, {min:401,max:450,prix:395}
            ],
            basePrice: 395,
            info: {
                title: 'Maison',
                iconId: 'icon-home',
                price: '235 € TTC',
                duration: '60 à 90 minutes',
                examples: ['Villa, pavillon, bungalow', 'Maison 4 façades avec grand jardin']
            }
        }
    };
    
    var MONTHS = ['JAN','FÉV','MAR','AVR','MAI','JUN','JUL','AOÛ','SEP','OCT','NOV','DÉC'];
    
    var currentType = 'appartement';
    var startPrice = null;
    var inputDebounceTimer = null;
    var modalContentType = null;
    var isReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var lastFocused = null;
    
    var $ = function(sel, ctx) { return (ctx || document).querySelector(sel); };
    var $$ = function(sel, ctx) { return (ctx || document).querySelectorAll(sel); };
    
    var els = {};
    
    var getConfig = function() { return CONFIG[currentType]; };
    
    function initCalendar() {
        var now = new Date();
        var day, month;
        try {
            var parts = new Intl.DateTimeFormat('fr-BE', {
                timeZone: 'Europe/Brussels',
                day: 'numeric',
                month: 'numeric'
            }).formatToParts(now);
            day = parts.find(function(x) { return x.type === 'day'; }).value;
            month = MONTHS[parseInt(parts.find(function(x) { return x.type === 'month'; }).value, 10) - 1];
        } catch(e) {
            day = now.getDate();
            month = MONTHS[now.getMonth()];
        }
        els.calendar.setAttribute('data-day', day);
        els.calendar.setAttribute('data-month', month);
    }
    
    function calculatePrice(surface) {
        var cfg = getConfig();
        var bounded = Math.max(cfg.min, Math.min(surface, cfg.max));
        var match = null;
        
        for (var i = 0; i < cfg.tarif.length; i++) {
            var t = cfg.tarif[i];
            if (bounded >= t.min && bounded <= t.max) {
                match = t;
                break;
            }
        }
        
        if (match) return match.prix;
        
        if (bounded > cfg.pivot) {
            var pivotMatch = null;
            for (var j = 0; j < cfg.tarif.length; j++) {
                if (cfg.pivot >= cfg.tarif[j].min && cfg.pivot <= cfg.tarif[j].max) {
                    pivotMatch = cfg.tarif[j];
                    break;
                }
            }
            var pivotPrice = pivotMatch ? pivotMatch.prix : cfg.basePrice;
            return pivotPrice + (bounded - cfg.pivot);
        }
        
        return cfg.tarif[0] ? cfg.tarif[0].prix : cfg.basePrice;
    }
    
    function updateFloatingPosition() {
        var cfg = getConfig();
        var value = parseInt(els.slider.value);
        var percentage = ((value - cfg.min) / (cfg.max - cfg.min)) * 100;
        
        var rect = els.sliderContainer.getBoundingClientRect();
        var padding = parseFloat(getComputedStyle(els.sliderContainer).paddingLeft);
        var trackWidth = rect.width - (padding * 2);
        
        var position = padding + (trackWidth * percentage / 100);
        var halfWidth = els.floating.offsetWidth / 2;
        
        position = Math.max(padding + halfWidth, Math.min(rect.width - padding - halfWidth, position));
        els.floating.style.setProperty('--floating-position', position + 'px');
    }
    
    function updateSliderProgress() {
        var cfg = getConfig();
        var value = parseInt(els.slider.value);
        var progress = ((value - cfg.min) / (cfg.max - cfg.min)) * 100;
        els.slider.style.setProperty('--peb-slider-progress', progress + '%');
    }
    
    function updateUIRealtime() {
        var value = parseInt(els.slider.value);
        els.input.value = value;
        els.price.textContent = calculatePrice(value);
        els.slider.setAttribute('aria-valuetext', value + ' m\u00E8tres carr\u00E9s');
        updateSliderProgress();
        updateFloatingPosition();
    }
    
    function animatePrice(from, to) {
        if (isReducedMotion || from === to) {
            els.price.textContent = to;
            return;
        }
        
        els.price.classList.add('slot-animate');
        var startTime = performance.now();
        var duration = 500;
        
        function step(now) {
            var elapsed = now - startTime;
            var progress = Math.min(elapsed / duration, 1);
            var ease = progress < 0.5 
                ? 2 * progress * progress 
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            
            els.price.textContent = Math.round(from + (to - from) * ease);
            
            if (progress < 1) {
                requestAnimationFrame(step);
            } else {
                els.price.textContent = to;
                els.price.classList.remove('slot-animate');
            }
        }
        requestAnimationFrame(step);
    }
    
    function updateUIWithAnimation() {
        var price = calculatePrice(parseInt(els.slider.value));
        if (startPrice !== null && startPrice !== price) {
            animatePrice(startPrice, price);
        } else {
            els.price.textContent = price;
        }
        startPrice = null;
    }
    
    function showError(message) {
        var root = $('.peb-calc-root');
        var existing = $('.peb-error-toast', root);
        if (existing) existing.remove();
        
        var toast = document.createElement('div');
        toast.className = 'peb-error-toast';
        toast.textContent = message;
        toast.setAttribute('role', 'alert');
        root.appendChild(toast);
        
        setTimeout(function() {
            toast.style.animation = 'peb-toast-in 0.3s ease-out reverse';
            toast.addEventListener('animationend', function() { toast.remove(); }, {once: true});
        }, 3000);
    }
    
    function validateInput() {
        var cfg = getConfig();
        var value = parseInt(els.input.value);
        
        els.input.classList.remove('error');
        
        if (isNaN(value) || els.input.value.trim() === '') {
            showError('Entrez une superficie entre ' + cfg.min + ' et ' + cfg.max + ' m\u00B2');
            els.input.classList.add('error');
            value = cfg.default;
        } else if (value < cfg.min) {
            showError('Superficie minimum : ' + cfg.min + ' m\u00B2');
            els.input.classList.add('error');
            value = cfg.min;
        } else if (value > cfg.max) {
            showError('Superficie maximum : ' + cfg.max + ' m\u00B2');
            els.input.classList.add('error');
            value = cfg.max;
        }
        
        els.input.value = value;
        els.slider.value = value;
        startPrice = calculatePrice(value);
        updateUIWithAnimation();
        updateUIRealtime();
        
        return value;
    }
    
    function setActiveTab(tabEl) {
        if (!tabEl || tabEl.classList.contains('active')) return;
        
        var allTabs = $$('.peb-tab', els.tabs);
        for (var i = 0; i < allTabs.length; i++) {
            allTabs[i].classList.remove('active');
            allTabs[i].setAttribute('aria-selected', 'false');
            allTabs[i].setAttribute('tabindex', '-1');
        }
        
        tabEl.classList.add('active');
        tabEl.setAttribute('aria-selected', 'true');
        tabEl.setAttribute('tabindex', '0');
        
        var targetId = tabEl.getAttribute('aria-controls');
        var panelKeys = Object.keys(els.panels);
        for (var j = 0; j < panelKeys.length; j++) {
            els.panels[panelKeys[j]].hidden = true;
            els.panels[panelKeys[j]].setAttribute('inert', '');
        }
        
        var target = document.getElementById(targetId);
        if (target) {
            target.hidden = false;
            target.removeAttribute('inert');
            if (els.card.parentNode !== target) {
                target.appendChild(els.card);
            }
        }
        
        currentType = tabEl.dataset.type;
        initUI();
        tabEl.focus();
        
        requestAnimationFrame(function() {
            requestAnimationFrame(positionBadge);
        });
    }
    
    function positionBadge() {
        var activeTab = $('.peb-tab.active');
        if (!activeTab || !els.badge || !els.card) return;
        
        var tabRect = activeTab.getBoundingClientRect();
        var cardRect = els.card.getBoundingClientRect();
        var tabsRect = els.tabs.getBoundingClientRect();
        
        var centerX = tabRect.left + (tabRect.width / 2) - tabsRect.left;
        var top = tabRect.bottom - cardRect.top + 4;
        
        els.badge.style.left = centerX + 'px';
        els.badge.style.maxWidth = (tabRect.width * 0.9) + 'px';
        els.badge.style.top = top + 'px';
        els.badge.classList.add('positioned');
    }
    
    function getModalContent() {
        var info = getConfig().info;
        var strokeClass = info.isStroke ? ' stroke-icon' : '';
        
        return '<div class="peb-modal-section">'
            + '<h3 class="peb-modal-section-title">'
            + '<svg class="peb-modal-section-icon' + strokeClass + '"><use href="#' + info.iconId + '"/></svg>'
            + '<span>' + info.title + '</span>'
            + '</h3>'
            + '<p><strong>À partir de ' + info.price + '</strong> (selon superficie)</p>'
            + '<p>⏱ <strong>Durée :</strong> ' + info.duration + '</p>'
            + '<p><strong>Exemples :</strong></p>'
            + '<ul>'
            + info.examples.map(function(ex) { return '<li>' + ex + '</li>'; }).join('')
            + '</ul>'
            + '</div>'
            + '<details class="peb-accordion">'
            + '<summary>💰 Tarifs ultra transparents</summary>'
            + '<div class="peb-accordion-content">'
            + '<p><strong>Prix affiché = Prix final</strong></p>'
            + '<p><strong>Mes garanties :</strong></p>'
            + '<ul>'
            + '<li>Zéro frais caché</li>'
            + '<li>Aucun supplément surprise</li>'
            + '<li>Prix fixe garanti</li>'
            + '<li>Paiement après intervention</li>'
            + '</ul>'
            + '</div>'
            + '</details>'
            + '<details class="peb-accordion">'
            + '<summary>📅 Rendez-vous rapide garanti</summary>'
            + '<div class="peb-accordion-content">'
            + '<ul>'
            + '<li>Disponible sous 24h ouvrables</li>'
            + '<li>Flexibilité horaire : du lundi au samedi</li>'
            + '<li>Déplacement gratuit dans toute la région de Bruxelles</li>'
            + '<li>Expert certifié (n° 001862747)</li>'
            + '</ul>'
            + '</div>'
            + '</details>'
            + '<details class="peb-accordion">'
            + '<summary>🏆 Engagement qualité</summary>'
            + '<div class="peb-accordion-content">'
            + '<ul>'
            + '<li>Certificateur PEB agréé (n° 001862747)</li>'
            + '<li>Respect strict des normes en vigueur</li>'
            + '<li>Rapport détaillé avec conseils personnalisés</li>'
            + '<li>Votre satisfaction est ma priorité</li>'
            + '</ul>'
            + '</div>'
            + '</details>'
            + '<details class="peb-accordion">'
            + '<summary>⚖️ Informations légales</summary>'
            + '<div class="peb-accordion-content">'
            + '<p>En prenant rendez-vous, vous acceptez mes conditions générales de service.</p>'
            + '<p style="margin-top: 0.5rem;">'
            + '<a href="https://pebify.be/conditions-generales/" target="_blank" rel="noopener">📜 Conditions générales</a><br>'
            + '<a href="https://pebify.be/politique-de-confidentialite/" target="_blank" rel="noopener">🔒 Politique de confidentialité</a>'
            + '</p>'
            + '</div>'
            + '</details>';
    }
    
    function handleModalKeydown(e) {
        if (e.key === 'Escape') {
            closeModal();
            return;
        }
        
        if (e.key === 'Tab') {
            var focusable = els.modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"]), summary');
            var first = focusable[0];
            var last = focusable[focusable.length - 1];
            
            if (e.shiftKey && document.activeElement === first) {
                last.focus();
                e.preventDefault();
            } else if (!e.shiftKey && document.activeElement === last) {
                first.focus();
                e.preventDefault();
            }
        }
    }
    
    function openModal() {
        lastFocused = document.activeElement;
        
        if (modalContentType !== currentType) {
            els.modalBody.innerHTML = getModalContent();
            modalContentType = currentType;
        }
        
        els.modal.classList.add('show');
        els.modal.setAttribute('aria-hidden', 'false');
        els.badge.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
        
        document.addEventListener('keydown', handleModalKeydown);
        
        els.modalClose.focus();
    }
    
    function closeModal() {
        els.modal.classList.remove('show');
        els.modal.setAttribute('aria-hidden', 'true');
        els.badge.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
        
        document.removeEventListener('keydown', handleModalKeydown);
        
        if (lastFocused) lastFocused.focus();
    }
    
    function handleCta() {
        var cfg = getConfig();
        var surface = parseInt(els.slider.value);
        var price = calculatePrice(surface);

        try {
            sessionStorage.setItem('peb_calc', JSON.stringify({
                type: cfg.label,
                surface: surface,
                price: price,
                code: 'peb_calc_cta'
            }));
        } catch(e) {}

        var params = '?type=' + encodeURIComponent(cfg.label)
            + '&surface=' + surface
            + '&price=' + price
            + '&code=peb_calc_cta';
        window.location.href = 'https://pebify.be/contact/' + params + '#form';
    }
    
    function initUI() {
        var cfg = getConfig();
        
        els.minLabel.innerHTML = cfg.min + ' m<sup>2</sup>';
        els.maxLabel.innerHTML = cfg.max + ' m<sup>2</sup>';
        els.slider.min = cfg.min;
        els.slider.max = cfg.max;
        els.input.setAttribute('min', cfg.min);
        els.input.setAttribute('max', cfg.max);
        els.slider.value = cfg.default;
        els.input.value = cfg.default;
        
        startPrice = calculatePrice(cfg.default);
        updateUIWithAnimation();
        updateUIRealtime();
        
        modalContentType = null;
    }
    
    function init() {
        els.slider = $('#surface-slider');
        els.input = $('#surface-input');
        els.floating = $('.peb-surface-floating');
        els.price = $('#current-price');
        els.minLabel = $('#min-label');
        els.maxLabel = $('#max-label');
        els.cta = $('#cta-button');
        els.calendar = $('#calendar-icon');
        els.modal = $('#info-modal');
        els.modalBody = $('#modal-body');
        els.badge = $('#premium-badge');
        els.modalClose = $('.peb-modal-close');
        els.tabs = $('.peb-tabs');
        els.card = $('.peb-calc-card');
        els.sliderContainer = $('.peb-slider-container');
        els.stepperMinus = $('#stepper-minus');
        els.stepperPlus = $('#stepper-plus');
        els.panels = {
            appartement: $('#panel-appartement'),
            duplex: $('#panel-duplex'),
            maison: $('#panel-maison')
        };

        initCalendar();
        initUI();
        
        els.slider.addEventListener('pointerdown', function() {
            startPrice = calculatePrice(parseInt(els.slider.value));
            els.slider.classList.add('interacted');
        }, { passive: true });
        
        els.slider.addEventListener('input', updateUIRealtime);
        els.slider.addEventListener('change', updateUIWithAnimation);
        
        els.input.addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            
            clearTimeout(inputDebounceTimer);
            inputDebounceTimer = setTimeout(function() {
                var cfg = getConfig();
                var val = parseInt(e.target.value);
                if (!isNaN(val) && val >= cfg.min && val <= cfg.max) {
                    els.slider.value = val;
                    startPrice = calculatePrice(val);
                    updateUIWithAnimation();
                    updateUIRealtime();
                }
            }, 600);
        });
        
        els.input.addEventListener('blur', function() {
            clearTimeout(inputDebounceTimer);
            validateInput();
        });
        
        els.input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                clearTimeout(inputDebounceTimer);
                validateInput();
                els.input.blur();
            }
        });
        
        function adjustSurface(delta) {
            var cfg = getConfig();
            var value = parseInt(els.input.value) || cfg.default;
            value = Math.max(cfg.min, Math.min(cfg.max, value + delta));
            els.input.value = value;
            els.slider.value = value;
            startPrice = calculatePrice(value);
            updateUIWithAnimation();
            updateUIRealtime();
        }
        
        els.stepperMinus.addEventListener('click', function() { adjustSurface(-1); });
        els.stepperPlus.addEventListener('click', function() { adjustSurface(1); });
        
        els.tabs.addEventListener('click', function(e) {
            var tab = e.target.closest('.peb-tab');
            if (tab) setActiveTab(tab);
        });
        
        els.tabs.addEventListener('keydown', function(e) {
            var tabs = Array.prototype.slice.call($$('.peb-tab', els.tabs));
            var idx = -1;
            for (var i = 0; i < tabs.length; i++) {
                if (tabs[i].classList.contains('active')) { idx = i; break; }
            }
            var next = null;
            
            switch (e.key) {
                case 'ArrowRight':
                case 'ArrowDown':
                    next = (idx + 1) % tabs.length;
                    break;
                case 'ArrowLeft':
                case 'ArrowUp':
                    next = (idx - 1 + tabs.length) % tabs.length;
                    break;
                case 'Home':
                    next = 0;
                    break;
                case 'End':
                    next = tabs.length - 1;
                    break;
                default:
                    return;
            }
            
            e.preventDefault();
            setActiveTab(tabs[next]);
        });
        
        els.badge.addEventListener('click', openModal);
        els.modalClose.addEventListener('click', closeModal);
        els.modal.addEventListener('click', function(e) {
            if (e.target === els.modal) closeModal();
        });
        
        els.modalBody.addEventListener('toggle', function(e) {
            if (e.target.open && e.target.classList.contains('peb-accordion')) {
                var allAccordions = $$('.peb-accordion', els.modalBody);
                for (var i = 0; i < allAccordions.length; i++) {
                    if (allAccordions[i] !== e.target && allAccordions[i].open) {
                        allAccordions[i].open = false;
                    }
                }
            }
        }, true);
        
        els.cta.addEventListener('click', handleCta);
        
        window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', function(e) {
            isReducedMotion = e.matches;
        });
        
        if ('ResizeObserver' in window) {
            var ro = new ResizeObserver(function() {
                requestAnimationFrame(function() {
                    positionBadge();
                    updateFloatingPosition();
                });
            });
            ro.observe($('.peb-calculator-column'));
        }
        
        requestAnimationFrame(function() {
            positionBadge();
            updateFloatingPosition();
        });
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
